name: Android CI/CD - Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép kích hoạt build thủ công từ giao diện GitHub Actions

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create secrets.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=${SUPABASE_URL:-}" > secrets.properties
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}" >> secrets.properties
          echo "secrets.properties created successfully."

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Warning: GOOGLE_SERVICES_JSON secret is missing! Build might fail if app/google-services.json is not present."
          else
            # Kiểm tra xem secret có phải dạng JSON trực tiếp hay Base64
            if echo "$GOOGLE_SERVICES_JSON" | grep -q '^{' ; then
              echo "Detected raw JSON format. Writing to app/google-services.json..."
              echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "Detected Base64 format. Decoding to app/google-services.json..."
              echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            fi
            echo "google-services.json configured."
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_FILE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0" # Tương thích với targetSdk 36

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-Signed-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
